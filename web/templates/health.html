<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0c11">
<title>Autopilot — здоровье</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/ui-state.js"></script>
</head>
<body>
<div class="layout">
  <aside class="side">
    <div class="logo"><div class="dot">A</div><b>Autopilot</b></div>
    <a class="item" href="/trade"><span class="ico">📈</span><span class="nm">Торговля</span></a>
    <a class="item" href="/robots"><span class="ico">🤖</span><span class="nm">Роботы</span></a>
    <div class="grow"></div>
    <div class="user"><div class="av"></div><div><div>Здоровье</div><small>журналы и сервисы</small></div></div>
  </aside>
  <main class="main">
    {% include "nav.html" %}
    <div class="page-head">
      <div><h2>Здоровье</h2><p>Единый лог заявок, событий роботов, таймеров и проблем сторожа.</p></div>
    </div>
    <div class="pf" id="kpi"></div>
    <div class="card mt"><h3>Статус</h3><div id="status-line" class="small muted">Загрузка…</div></div>
    <div class="card mt">
      <div class="row"><h3>Лог</h3>
        <select id="log-source" data-ui-restore="logSource" class="input">
          <option value="all">все</option><option value="orders">заявки</option>
          <option value="instances">роботы</option><option value="scheduler">таймеры</option>
          <option value="health">здоровье</option>
        </select>
      </div>
      <div class="table-wrap"><table class="table"><thead><tr>
        <th>Время</th><th>Источник</th><th>Событие</th>
      </tr></thead><tbody id="log-rows"><tr><td colspan="3" class="muted">Загрузка…</td></tr></tbody></table></div>
    </div>
  </main>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let ITEMS = [];
function render(){
  const src = $('log-source').value;
  const rows = ITEMS.filter(x => src === 'all' || x.source === src);
  $('log-rows').innerHTML = rows.length ? rows.map(x=>`<tr>
    <td class="muted">${esc(String(x.ts||'').replace('T',' ').slice(0,19))}</td>
    <td>${esc(x.source)}</td><td>${esc(x.text)}</td></tr>`).join('')
    : '<tr><td colspan="3" class="muted">Событий нет</td></tr>';
}
async function load(){
  try{
    const h = await (await fetch('/api/health')).json();
    $('status-line').innerHTML = `Проверка ${esc(h.checked)}: <b>${esc(h.status)}</b>, `
      + `проблем ${h.problems.length}, предупреждений ${h.warnings.length}, строк ${h.rows}`;
    $('kpi').innerHTML = `<div class="it"><span>Статус</span><b>${esc(h.status)}</b></div>
      <div class="it"><span>Проблемы</span><b>${h.problems.length}</b></div>
      <div class="it"><span>Данные до</span><b>${esc(h.data_date)}</b></div>`;
    const j = await (await fetch('/api/logs?limit=150', {cache:'no-store'})).json();
    ITEMS = j.items; render();
  }catch(e){ $('status-line').textContent = 'Нет данных: ' + e.message; }
}
$('log-source').addEventListener('change', render);
load();
</script>
</body>
</html>
